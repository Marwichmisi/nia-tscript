[package]
name = "nia-tscircuit-studio"
version = "0.1.2"
description = "Studio PCB agentique (Tauri + tscircuit), piloté par ton agent IA via MCP."
authors = ["nia-tscircuit"]
edition = "2021"

[lib]
name = "nia_tscircuit_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
base64 = "0.22"
getrandom = "0.3"
notify = "8"
notify-debouncer-mini = "0.7"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
